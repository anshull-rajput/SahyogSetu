{% extends 'base.html' %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-icon">🔧</div>
    <span class="eyebrow">Worker Account</span>
    <h1>Worker Login</h1>
    <p class="muted">Access booking requests, jobs, earnings and cooperative benefits.</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      {% csrf_token %}
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter worker username" autocomplete="username" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit">Login as Worker</button>
    </form>
    <div class="demo-box"><strong>Demo worker</strong><br>Username: <code>rajesh</code><br>Password: <code>worker123</code></div>
    <a class="back-link" href="{% url 'login' %}">← Choose another account</a>
  </div>
</div>
{% endblock %}
